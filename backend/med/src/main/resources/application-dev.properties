#Porta 5433 nesse caso por ser um ambiente externo ao do docker configurado
spring.datasource.url=jdbc:postgresql://localhost:5433/rickscar
spring.datasource.username=postgres
spring.datasource.password=1234567

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

# Chave JWT fixa do ambiente de desenvolvimento (gerar com openssl, ver JwtConfig).
# O caminho relativo parte da pasta backend/med. Nunca versionar este arquivo.
security.jwt.private-key=${JWT_PRIVATE_KEY:file:./secrets/jwt-private.pem}
