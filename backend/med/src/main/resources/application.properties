spring.profiles.active=${APP_PROFILE:test}
spring.jpa.open-in-view=false

#Formato de datas (Jackson)
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=GMT-3

#Variaveis que sera usadas nos configs

# --- Authorization Server (client usado no grant "password") ---
# Pode sobrescrever via variavel de ambiente sem editar este arquivo, ex:
# CRUZADINHA_CLIENT_SECRET=algo-mais-forte ./mvnw spring-boot:run
security.client-id=${CLIENT_ID:cruzadinha-client}
security.client-secret=${CLIENT_SECRET:cruzadinha-secret}
security.jwt.duration=${JWT_DURATION:86400}

# --- CORS (origens permitidas, separadas por virgula) ---
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:5173}
