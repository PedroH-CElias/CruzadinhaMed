spring.profiles.active=${APP_PROFILE:test}
spring.jpa.open-in-view=false

#Formato de datas (Jackson)
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=GMT-3

#Variaveis que sera usadas nos configs

# --- Autenticacao (JWT de acesso + refresh token) ---
# Validade do token de acesso em segundos (900 = 15 minutos)
security.jwt.access-token-duration=${JWT_ACCESS_DURATION:900}
# Validade do refresh token em segundos (2592000 = 30 dias)
security.jwt.refresh-token-duration=${JWT_REFRESH_DURATION:2592000}

# --- E-mail (codigo de "esqueci minha senha") ---
# Remetente dos e-mails enviados pelo app
app.mail.from=${MAIL_FROM:CruzadinhaMed <nao-responda@cruzadinhamed.com.br>}
# Para enviar e-mails de verdade, descomente e configure (senha SEMPRE por variavel de ambiente):
#spring.mail.host=${MAIL_HOST}
#spring.mail.port=${MAIL_PORT:587}
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# --- CORS (origens permitidas, separadas por virgula) ---
cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:5173}
