# =====================================================================
# Perfil de PRODUCAO. Ativar com a variavel de ambiente APP_PROFILE=prod.
# Todos os segredos vem de variaveis de ambiente: nada sensivel neste arquivo.
#
# Variaveis obrigatorias:
#   DB_URL           ex.: jdbc:postgresql://host:5432/cruzadinhamed
#   DB_USERNAME      usuario do banco
#   DB_PASSWORD      senha do banco
#   JWT_PRIVATE_KEY  chave RSA PKCS#8 (caminho file:... ou conteudo PEM)
# Opcionais: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM, CORS_ORIGINS
# =====================================================================

# --- Banco de dados (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# As tabelas sao criadas manualmente (ver db/schema-postgres.sql). O Hibernate apenas
# confere, ao subir, se as tabelas batem com as entidades; se nao baterem, a aplicacao para.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Chave JWT (obrigatoria: sem ela a aplicacao nao sobe) ---
security.jwt.private-key=${JWT_PRIVATE_KEY}

# --- HTTPS / proxy ---
# A hospedagem recebe o HTTPS e repassa para a aplicacao. Esta opcao faz o backend
# considerar os headers X-Forwarded-* do proxy: IP real do cliente (usado no limite de
# requisicoes) e o protocolo https nas URLs geradas.
server.forward-headers-strategy=native

# --- Erros: nunca expor detalhes internos nas respostas ---
server.error.include-stacktrace=never
server.error.include-exception=false
